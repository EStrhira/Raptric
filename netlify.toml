[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIza"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirect old esthira warranty page to raptric
[[redirects]]
  from = "https://esthira.com/warranty-activation"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

[[redirects]]
  from = "https://esthira.com/warranty-activation/"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

[[redirects]]
  from = "https://esthira.com/warranty-activation/*"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/warranty-activation"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/warranty-activation/"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/warranty-activation/*"
  to = "https://raptric.in/warranty-activation"
  status = 301
  force = true

# Manual redirect
[[redirects]]
  from = "https://esthira.com/manual"
  to = "https://raptric.in/manual"
  status = 301
  force = true

[[redirects]]
  from = "https://esthira.com/manual/"
  to = "https://raptric.in/manual"
  status = 301
  force = true

[[redirects]]
  from = "https://esthira.com/manual/*"
  to = "https://raptric.in/manual"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/manual"
  to = "https://raptric.in/manual"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/manual/"
  to = "https://raptric.in/manual"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/manual/*"
  to = "https://raptric.in/manual"
  status = 301
  force = true

# Redirect all esthira pages to raptric
[[redirects]]
  from = "https://esthira.com/*"
  to = "https://raptric.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.esthira.com/*"
  to = "https://raptric.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
